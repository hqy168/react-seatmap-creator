name: CI - tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-build:
    name: Lint and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies (prefer npm ci, fallback to legacy-peer-deps)
        run: |
          set -eux
          npm ci || npm install --legacy-peer-deps

      - name: Run ESLint
        run: |
          npm run eslint || true

      - name: Build
        run: |
          # Attempt a production build to catch type/compile errors
          GENERATE_SOURCEMAP=false npm run build

  test:
    name: Run tests
    runs-on: ubuntu-latest
    needs: lint-and-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies (prefer npm ci, fallback to legacy-peer-deps)
        run: |
          set -eux
          # Prefer a clean, reproducible install when possible
          npm ci || npm install --legacy-peer-deps

      - name: Run tests
        env:
          CI: true
        run: |
          npm test -- --watchAll=false
